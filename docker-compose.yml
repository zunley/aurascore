services:
  aurascore:
    image: aurascore:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurascore
    restart: unless-stopped
    ports:
      - "${PORT:-9302}:9302"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=9302
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-20}
    volumes:
      - ./data:/app/data
    healthcheck:
      # slim 镜像没有 wget/curl，用 node 自带 fetch 探活
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9302/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
