<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>music-dance-gpt · render console</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">music-dance-gpt</div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="jobs">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 8h12M2 13h8" /></svg>
          <span>渲染任务</span>
          <span class="nav-count" id="nav-jobs-count"></span>
        </button>
        <button class="nav-item" data-view="new">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
          <span>新建任务</span>
        </button>
        <button class="nav-item" data-view="soundfonts">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" /><circle cx="8" cy="8" r="1.5" /></svg>
          <span>音色库</span>
          <span class="nav-count" id="nav-sf-count"></span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="service-status" id="service-status">
          <span class="dot dot-off"></span>
          <span class="service-name" id="service-text">connecting…</span>
        </div>
        <label class="field-label" for="api-key">API KEY</label>
        <input class="input" id="api-key" type="password" placeholder="(未设置)" autocomplete="off" spellcheck="false" />
      </div>
    </aside>

    <main class="main">
      <!-- 任务列表 -->
      <section class="view" id="view-jobs">
        <header class="view-head">
          <h1>渲染任务</h1>
          <button class="btn" id="btn-refresh-jobs">刷新</button>
        </header>
        <div class="stats" id="jobs-stats"></div>
        <div id="jobs-list" class="card-grid"></div>
      </section>

      <!-- 新建任务 -->
      <section class="view hidden" id="view-new">
        <header class="view-head">
          <h1>新建任务</h1>
        </header>
        <form id="job-form" class="card form-card" autocomplete="off">
          <div class="card-head">NEW RENDER JOB</div>

          <div class="form-grid">
            <label class="field span2">
              <span class="field-label">MIDI 文件 (.mid)</span>
              <input class="input file-input" id="job-file" type="file" accept=".mid,audio/midi" required />
              <span class="field-hint" id="file-hint">≤ 5MB · ≤ 300s</span>
            </label>

            <label class="field span2">
              <span class="field-label">曲名 (TITLE)</span>
              <input class="input" id="job-title" type="text" maxlength="200" placeholder="Untitled nocturne" />
            </label>

            <label class="field">
              <span class="field-label">帧率 (FPS)</span>
              <select class="input" id="job-fps">
                <option value="24">24</option>
                <option value="30" selected>30</option>
                <option value="60">60</option>
              </select>
            </label>

            <label class="field">
              <span class="field-label">分辨率预设</span>
              <select class="input" id="job-preset">
                <option value="1280x720" selected>1280 × 720</option>
                <option value="1920x1080">1920 × 1080</option>
                <option value="854x480">854 × 480</option>
                <option value="custom">自定义</option>
              </select>
            </label>

            <label class="field">
              <span class="field-label">宽度 (WIDTH)</span>
              <input class="input" id="job-width" type="number" min="320" max="1920" value="1280" />
            </label>

            <label class="field">
              <span class="field-label">高度 (HEIGHT)</span>
              <input class="input" id="job-height" type="number" min="180" max="1080" value="720" />
            </label>

            <label class="field span2">
              <span class="field-label">音色 (SOUNDFONT)</span>
              <select class="input" id="job-soundfont"></select>
            </label>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" id="btn-submit" type="submit">提交渲染</button>
            <span class="form-status" id="job-form-status"></span>
          </div>
        </form>
      </section>

      <!-- 音色库 -->
      <section class="view hidden" id="view-soundfonts">
        <header class="view-head">
          <h1>音色库</h1>
          <button class="btn" id="btn-refresh-sf">刷新</button>
        </header>

        <form id="sf-form" class="card form-card">
          <div class="card-head">REGISTER SOUNDFONT</div>
          <div class="form-grid">
            <label class="field span2">
              <span class="field-label">名称 (NAME)</span>
              <input class="input" id="sf-name" type="text" placeholder="flower-piano" pattern="[a-z0-9][a-z0-9_-]{0,63}" required />
              <span class="field-hint">a-z 0-9 _ - ，字母数字开头，≤ 64 字符</span>
            </label>
            <label class="field span2">
              <span class="field-label">SoundFont 文件 (.sf2)</span>
              <input class="input file-input" id="sf-file" type="file" accept=".sf2" required />
              <span class="field-hint">≤ 512MB</span>
            </label>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="btn-sf-upload" type="submit">上传注册</button>
            <span class="form-status" id="sf-form-status"></span>
          </div>
        </form>

        <div class="card">
          <div class="card-head">LIBRARY</div>
          <div id="sf-list" class="list"></div>
        </div>
      </section>
    </main>

    <div class="toasts" id="toasts"></div>

    <div class="modal hidden" id="preview-modal">
      <div class="modal-box">
        <div class="modal-head">
          <span id="preview-title"></span>
          <button class="btn" id="preview-close">关闭</button>
        </div>
        <video id="preview-video" controls autoplay playsinline></video>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
